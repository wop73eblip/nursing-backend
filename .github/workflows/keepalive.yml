name: Supabase Keepalive

# 目的:每 6 小時做「真寫入」保 Supabase 免費 tier 不 pause
#
# 為什麼要真寫入而不是 SELECT?
# Supabase 免費 tier 可能認為 SELECT 是快取讀取(不算活動),
# 用 PATCH 更新 rules.updated_at 保證 DB 有真的 write activity。

on:
  schedule:
    # 每 6 小時執行 = 台灣時間 02:00 / 08:00 / 14:00 / 20:00
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write Supabase heartbeat (real DB activity)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 <<'PYEOF'
          import os, json, urllib.request, urllib.error, sys
          from datetime import datetime, timezone

          url = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_SERVICE_KEY']
          headers = {
              'apikey': key,
              'Authorization': f'Bearer {key}',
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal',
          }

          # 1. 讀 rules 拿 id
          try:
              req = urllib.request.Request(
                  f"{url}/rest/v1/rules?select=id&limit=1",
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=10) as r:
                  rows = json.load(r)
              if not rows:
                  print("❌ rules table 沒有資料")
                  sys.exit(1)
              rid = rows[0]['id']
              print(f"✓ 讀到 rules id={rid}")
          except urllib.error.URLError as e:
              print(f"❌ 讀 rules 失敗: {e}")
              sys.exit(1)

          # 2. PATCH updated_at(真寫入,Supabase 100% 認為有活動)
          now = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          try:
              req = urllib.request.Request(
                  f"{url}/rest/v1/rules?id=eq.{rid}",
                  data=json.dumps({'updated_at': now}).encode(),
                  headers=headers,
                  method='PATCH',
              )
              with urllib.request.urlopen(req, timeout=10) as r:
                  print(f"✅ HTTP {r.status} · rules.updated_at 已寫為 {now}")
          except urllib.error.URLError as e:
              print(f"❌ PATCH 失敗: {e}")
              sys.exit(1)
          PYEOF

      - name: Ping Railway backend (順便保持活躍)
        run: |
          resp=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "https://web-production-e9f2a5.up.railway.app/")
          echo "Railway HTTP: $resp"
          if [ "$resp" != "200" ]; then
            echo "⚠ Railway 回應非 200,但 Supabase 已 keep alive"
          fi
